{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — MindSpace</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  <style>
    body { background: var(--cream); }
    .login-wrap {
      min-height: 100vh; display: flex;
      align-items: center; justify-content: center;
      padding: 100px 24px 40px;
    }
    .login-card {
      background: white; border-radius: var(--radius);
      padding: 48px; width: 100%; max-width: 420px;
      box-shadow: var(--shadow-med);
    }
    .login-logo { text-align: center; margin-bottom: 32px; }
    .login-card h1 { font-size: 26px; text-align: center; margin-bottom: 6px; }
    .login-card > p { font-size: 14px; color: var(--mid-gray); text-align: center; margin-bottom: 28px; line-height: 1.6; }
    .login-card > p a { color: var(--sage-dark); font-weight: 500; }
    .submit-btn {
      width: 100%; padding: 14px;
      background: var(--sage); color: white;
      border: none; border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px; font-weight: 500;
      cursor: pointer; transition: all 0.25s;
      margin-top: 8px;
    }
    .submit-btn:hover { background: var(--sage-dark); transform: translateY(-1px); }
    .back-link { display:block; text-align:center; margin-top:20px; font-size:13px; color:var(--mid-gray); }
    .back-link a { color: var(--sage-dark); font-weight: 500; }
  </style>
</head>
<body>
  <nav class="navbar" style="position:fixed">
    <a href="{% url 'index' %}" class="nav-logo">
      <div class="nav-logo-dot">&#9825;</div>
      MindSpace
    </a>
    <a href="{% url 'login' %}" class="btn btn-outline">Back to log in</a>
  </nav>

  <div class="login-wrap">
    <div class="login-card fade-up">
      <div class="login-logo">
        <div class="nav-logo" style="justify-content:center;font-family:'DM Serif Display',serif;font-size:22px">
          <div class="nav-logo-dot">&#9825;</div> MindSpace
        </div>
      </div>
      <h1>Reset your password</h1>
      <p>Enter the email address you signed up with and we'll send you a link to reset your password.</p>

      <form method="post" novalidate>
        {% csrf_token %}
        <div class="form-group">
          <label for="id_email">Email address</label>
          <input type="email" name="email" id="id_email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <button type="submit" class="submit-btn">Send reset link</button>
      </form>

      <div class="back-link">Remembered it after all? <a href="{% url 'login' %}">Log in</a></div>
    </div>
  </div>
</body>
</html>
