<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Admin{% endblock %} · MindSpace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root { --sage:#7a9e87; --sage-light:#b5cebf; --sage-dark:#4a6b57; --wash:#eef4f0; --cream:#f8f4ee; --cream-dark:#ede8de;
            --white:#fdfaf6; --terra:#c4714a; --terra-wash:#fbefe8; --charcoal:#2c2c2c; --mid:#6b6b6b; --line:#d4d0ca; --err:#c0392b; --err-bg:#fdf0ef; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',system-ui,sans-serif;background:var(--white);color:var(--charcoal);line-height:1.6;font-size:15px}
    a{color:inherit;text-decoration:none}
    h1,h2,h3{font-family:'DM Serif Display',Georgia,serif;font-weight:400;line-height:1.2}
    .shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
    aside{background:var(--charcoal);color:rgba(255,255,255,.75);padding:28px 18px;display:flex;flex-direction:column;gap:4px}
    .brand{font-family:'DM Serif Display',serif;font-size:22px;color:#fff;margin:0 10px 4px}
    .role{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--sage-light);margin:0 10px 22px}
    aside a{padding:9px 12px;border-radius:8px;font-size:14px}
    aside a:hover{background:rgba(255,255,255,.06);color:#fff}
    aside a.on{background:rgba(122,158,135,.22);color:#fff}
    aside .spacer{flex:1}
    aside .me{font-size:12px;color:rgba(255,255,255,.45);padding:0 12px;word-break:break-all}
    main{padding:40px 48px;max-width:1150px;width:100%}
    .head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:26px}
    .head h1{font-size:34px}
    .muted{color:var(--mid)} .small{font-size:13px}
    .grid{display:grid;gap:16px}
    .g4{grid-template-columns:repeat(4,1fr)} .g2{grid-template-columns:1fr 1fr}
    .card{background:#fff;border:1px solid var(--cream-dark);border-radius:14px;padding:22px}
    .stat b{display:block;font-family:'DM Serif Display',serif;font-size:32px;color:var(--sage-dark);font-weight:400}
    .stat span{font-size:13px;color:var(--mid)}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th{text-align:left;font-weight:500;font-size:12px;color:var(--mid);text-transform:uppercase;letter-spacing:.05em;padding:10px 12px;border-bottom:1px solid var(--cream-dark)}
    td{padding:12px;border-bottom:1px solid var(--cream-dark);vertical-align:top}
    tr.link:hover td{background:var(--cream);cursor:pointer}
    .pill{display:inline-block;font-size:12px;font-weight:500;padding:3px 10px;border-radius:99px;background:var(--cream-dark)}
    .pill.ok{background:var(--wash);color:var(--sage-dark)} .pill.warn{background:var(--terra-wash);color:var(--terra)} .pill.admin{background:var(--charcoal);color:#fff}
    .btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:99px;padding:9px 18px;font:500 14px 'DM Sans',sans-serif;cursor:pointer;background:var(--sage);color:#fff}
    .btn:hover{background:var(--sage-dark)}
    .btn.outline{background:transparent;color:var(--charcoal);border:1.5px solid var(--line)} .btn.outline:hover{border-color:var(--sage)}
    .btn.danger{background:var(--err)} .btn.warn{background:var(--terra)}
    input,select{font:14px 'DM Sans',sans-serif;padding:9px 14px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--charcoal)}
    input:focus,select:focus{outline:none;border-color:var(--sage)}
    form.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .msg{padding:12px 16px;border-radius:8px;margin-bottom:18px;font-size:14px}
    .msg.success{background:var(--wash);color:var(--sage-dark)} .msg.error{background:var(--err-bg);color:var(--err)}
    .bar{height:10px;border-radius:5px;background:var(--cream);overflow:hidden} .bar i{display:block;height:100%;background:var(--sage)}
    .stars{color:#c9973a;letter-spacing:1px}
    .note{background:var(--cream);border-radius:10px;padding:14px 16px;font-size:13px;color:var(--mid)}
    textarea{font:14px 'DM Sans',sans-serif;padding:10px 14px;border:1.5px solid var(--line);border-radius:8px;width:100%;min-height:80px}
    .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px} .tabs a{padding:7px 14px;border-radius:99px;font-size:13px;font-weight:500;background:var(--cream)} .tabs a.on{background:var(--charcoal);color:#fff}
    .kv{display:grid;grid-template-columns:170px 1fr;gap:8px 16px;font-size:14px} .kv dt{color:var(--mid)}
    .field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500} .field input,.field select{width:100%}
    .checks{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13.5px;font-weight:400}
    .pager{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
    @media (max-width:900px){.shell{grid-template-columns:1fr} aside{flex-direction:row;flex-wrap:wrap;padding:14px} aside .spacer,.role,.me{display:none} main{padding:24px 18px} .g4{grid-template-columns:1fr 1fr} .g2{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand">MindSpace</div>
    <div class="role">Admin panel</div>
    <a href="{% url 'adminpanel:dashboard' %}" class="{% if nav == 'dashboard' %}on{% endif %}">Dashboard</a>
    <a href="{% url 'adminpanel:users' %}" class="{% if nav == 'users' %}on{% endif %}">Users</a>
    <a href="{% url 'adminpanel:professionals' %}" class="{% if nav == 'pros' %}on{% endif %}">Professionals</a>
    <a href="{% url 'adminpanel:admins' %}" class="{% if nav == 'admins' %}on{% endif %}">Admins</a>
    <a href="{% url 'adminpanel:ratings' %}" class="{% if nav == 'ratings' %}on{% endif %}">App ratings</a>
    <a href="{% url 'adminpanel:reports' %}" class="{% if nav == 'reports' %}on{% endif %}">Reports</a>
    <a href="{% url 'adminpanel:audit' %}" class="{% if nav == 'audit' %}on{% endif %}">Audit log</a>
    <a href="{% url 'adminpanel:backups' %}" class="{% if nav == 'backups' %}on{% endif %}">Backups</a>
    <div class="spacer"></div>
    <a href="/">Back to MindSpace</a>
    <div class="me">{{ request.user.email }}</div>
  </aside>
  <main>
    {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
